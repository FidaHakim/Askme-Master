<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Askme AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.puter.com/v2/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at bottom, #e0f2fe 0%, #f8fafc 40%, #ffffff 100%);
            overflow: hidden;
        }
        /* Custom scrollbar for message view */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="h-screen w-screen max-h-screen flex text-zinc-800 relative overflow-hidden">

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/20 z-30 hidden opacity-0 transition-opacity duration-300" onclick="toggleSidebar()"></div>

    <div id="action-popup-menu" class="fixed hidden bg-white/90 backdrop-blur-md border border-zinc-200/80 p-1.5 rounded-2xl shadow-xl z-50 transition-all duration-150 scale-95 opacity-0 pointer-events-none min-w-[130px] flex flex-col gap-0.5">
        <div id="popup-actions-wrapper"></div>
    </div>

    <aside id="sidebar" class="fixed top-0 left-0 h-full w-[280px] bg-zinc-50 border-r border-zinc-200/80 z-40 transform -translate-x-full transition-transform duration-300 flex flex-col justify-between p-4 shadow-2xl md:shadow-none">
        <div class="flex flex-col gap-2 overflow-y-auto custom-scrollbar flex-1">
            <div class="text-xl font-medium px-3 pt-2 text-zinc-900">Askme</div>
            
            <button onclick="startNewChat()" class="w-full flex items-center justify-between bg-zinc-200/60 hover:bg-zinc-200 text-zinc-800 font-medium py-3 px-4 rounded-2xl transition mt-2">
                <span>New chat</span>
                <i data-lucide="square-pen" class="w-5 h-5 text-zinc-600"></i>
            </button>
            
            <div class="w-full relative mt-1">
                <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="search-chat-input" oninput="filterChatHistory()" placeholder="Search chats" class="w-full bg-zinc-200/30 hover:bg-zinc-200/50 focus:bg-white focus:ring-1 focus:ring-zinc-200 outline-none text-sm text-zinc-700 py-2.5 pl-10 pr-4 rounded-xl transition font-medium">
            </div>

            <button id="library-toggle-btn" onclick="toggleLibraryMode()" class="w-full flex items-center justify-between bg-white/60 hover:bg-zinc-200/50 text-zinc-700 py-2.5 px-4 rounded-xl transition mt-0.5">
                <div class="flex items-center gap-3">
                    <i data-lucide="layout-grid" class="w-5 h-5 text-zinc-500"></i>
                    <span id="library-btn-text" class="text-sm font-medium">Library</span>
                </div>
            </button>

            <hr class="border-zinc-200 my-2">

            <div class="px-3 text-xs font-semibold text-zinc-400 uppercase tracking-wider">Notebooks</div>
            <button class="w-full flex items-center gap-3 hover:bg-zinc-200/50 text-zinc-700 py-2 px-4 rounded-xl transition text-sm">
                <i data-lucide="plus" class="w-4 h-4 text-zinc-500"></i>
                <span>New notebook</span>
            </button>

            <hr class="border-zinc-200 my-2">

            <div id="section-title-label" class="px-3 text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Recents</div>
            <div id="history-item-list" class="flex flex-col gap-0.5">
                <div id="empty-history-notice" class="px-3 py-2 text-xs text-zinc-400 italic font-normal">No recent chats. Start typing below!</div>
            </div>
        </div>

        <div class="border-t border-zinc-200 pt-3 flex items-center justify-between mt-auto">
            <div class="flex items-center gap-3" onclick="handleAuthAction()" class="cursor-pointer">
                <div id="user-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-sky-400 to-indigo-500 flex items-center justify-center text-white font-bold text-sm shadow-sm overflow-hidden select-none">
                    ?
                </div>
                <div class="flex flex-col">
                    <span id="user-name" class="text-sm font-medium text-zinc-900 truncate max-w-[140px]">Guest Account</span>
                    <span id="user-status" class="text-[11px] text-zinc-400 font-medium">Click to Log In</span>
                </div>
            </div>
            <button class="p-2 text-zinc-500 hover:bg-zinc-200/70 rounded-full transition">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
        
        <header class="w-full h-16 flex items-center justify-between px-4 bg-white/60 backdrop-blur-md border-b border-b-zinc-100/80 z-20">
            <button onclick="toggleSidebar()" class="p-2 hover:bg-zinc-100 rounded-full transition flex flex-col justify-center items-center gap-[4px] w-10 h-10">
                <div class="w-5 h-[2px] bg-zinc-800 rounded-full"></div>
                <div class="w-5 h-[2px] bg-zinc-800 rounded-full"></div>
            </button>

            <div class="relative">
                <button id="model-dropdown-btn" onclick="toggleDropdownMenu()" class="flex items-center gap-1.5 text-zinc-700 font-medium px-3 sm:px-4 py-1.5 rounded-2xl hover:bg-zinc-100 transition text-[14px] sm:text-[15px]">
                    <span id="active-model-display">Askme 4.5</span>
                    <i id="dropdown-arrow-icon" data-lucide="chevron-down" class="w-4 h-4 text-zinc-500 transition-transform duration-200"></i>
                </button>

                <div id="model-dropdown" class="absolute left-1/2 -translate-x-1/2 mt-2 w-[calc(100vw-32px)] max-w-72 bg-white border border-zinc-200 shadow-2xl rounded-[28px] py-3 hidden z-50 animate-in fade-in slide-in-from-top-2 duration-200">
                    <div onclick="selectModel('4.5')" class="flex items-start gap-3 px-4 py-3 hover:bg-zinc-50 cursor-pointer relative">
                        <div id="chk-4-5" class="check-icon absolute left-4 top-4 text-zinc-800">
                            <i data-lucide="check" class="w-4 h-4"></i>
                        </div>
                        <div class="pl-6">
                            <div class="font-medium text-sm text-zinc-900">Askme 4.5</div>
                            <div class="text-xs text-zinc-400 mt-0.5">Most capable model</div>
                        </div>
                    </div>
                    <div onclick="selectModel('OpenAI GPT')" class="flex items-start gap-3 px-4 py-3 hover:bg-zinc-50 cursor-pointer relative">
                        <div id="chk-openai" class="check-icon absolute left-4 top-4 text-zinc-800 invisible">
                            <i data-lucide="check" class="w-4 h-4"></i>
                        </div>
                        <div class="pl-6">
                            <div class="font-medium text-sm text-zinc-900">OpenAI GPT</div>
                            <div class="text-xs text-zinc-400 mt-0.5">Highly structured logical tracking</div>
                        </div>
                    </div>

                    <hr class="border-zinc-100 my-2">

                    <div class="px-4 py-1.5">
                        <div class="flex items-center justify-between text-sm text-zinc-700 font-medium cursor-pointer" onclick="toggleThinkingSubmenu(event)">
                            <span>Thinking level</span>
                            <i id="thinking-arrow" data-lucide="chevron-down" class="w-4 h-4 text-zinc-400 transition-transform duration-200"></i>
                        </div>
                        <div id="thinking-submenu" class="flex flex-col gap-1.5 mt-2 overflow-hidden transition-all duration-200" style="max-height: 200px;">
                            <div onclick="selectThinkingLevel('Standard')" class="flex items-center gap-3 p-1.5 rounded-xl hover:bg-zinc-50 cursor-pointer relative pl-7">
                                <i id="chk-standard" data-lucide="check" class="thinking-check w-3.5 h-3.5 text-zinc-800 absolute left-1.5 top-1/2 -translate-y-1/2"></i>
                                <div>
                                    <div class="text-xs font-medium text-zinc-900">Standard</div>
                                    <div class="text-[11px] text-zinc-400">Best for most questions</div>
                                </div>
                            </div>
                            <div onclick="selectThinkingLevel('Extended')" class="flex items-center gap-3 p-1.5 rounded-xl hover:bg-zinc-50 cursor-pointer relative pl-7 opacity-80">
                                <i id="chk-extended" data-lucide="check" class="thinking-check w-3.5 h-3.5 text-zinc-800 absolute left-1.5 top-1/2 -translate-y-1/2 invisible"></i>
                                <div>
                                    <div class="text-xs font-medium text-zinc-900">Extended</div>
                                    <div class="text-[11px] text-zinc-400">Complex problem solving</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="startNewChat()" class="p-2 border border-dashed border-zinc-300 rounded-full text-zinc-700 hover:bg-zinc-50 transition w-10 h-10 flex items-center justify-center">
                <i data-lucide="pen-tool" class="w-4 h-4 text-zinc-600"></i>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto px-4 py-6 flex flex-col items-center custom-scrollbar relative" id="scroll-workspace">
            
            <div id="splash-view" class="my-auto flex flex-col items-center text-center animate-in fade-in zoom-in-95 duration-300 pb-44 relative w-full shrink-0">
                <div class="w-16 h-16 relative flex items-center justify-center mb-6">
                    <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-[0_4px_12px_rgba(56,189,248,0.4)]">
                        <defs>
                            <linearGradient id="askmeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#f43f5e" />
                                <stop offset="30%" stop-color="#fbbf24" />
                                <stop offset="70%" stop-color="#38bdf8" />
                                <stop offset="100%" stop-color="#6366f1" />
                            </linearGradient>
                        </defs>
                        <path d="M50 0 C50 35, 35 50, 0 50 C35 50, 50 65, 50 100 C50 65, 65 50, 100 50 C65 50, 50 35, 50 0 Z" fill="url(#askmeGrad)"/>
                    </svg>
                </div>
                <h1 class="text-[28px] sm:text-[32px] font-normal text-zinc-900 tracking-tight leading-snug max-w-xs">
                    What should we focus on?
                </h1>
            </div>

            <div id="message-feed-stream" class="w-full max-w-2xl flex flex-col gap-6 hidden pb-24 mt-8"></div>
        </div>

        <footer id="active-chat-footer" class="w-full p-4 bg-gradient-to-t from-white via-white/90 to-transparent z-20 flex justify-center mt-auto mb-20">
            <div id="intro-input-wrapper" class="w-full max-w-2xl bg-zinc-100/90 backdrop-blur-md rounded-[32px] px-3 sm:px-4 py-2 flex flex-col gap-2 shadow-sm border border-zinc-200/40 transition-all duration-300">
                
                <input type="file" id="attachment-file-engine" class="hidden" accept="image/*, .pdf, .txt, .doc, .docx, .json, .xml, .js, .html, .css" onchange="handleFileSelected(this)">
                
                <div id="file-preview-bay" class="hidden items-center gap-2 bg-zinc-200/80 self-start px-3 py-1 rounded-full text-xs text-zinc-700 font-medium ml-10 animate-in fade-in zoom-in-95 duration-150">
                    <i data-lucide="paperclip" class="w-3.5 h-3.5"></i>
                    <span id="file-meta-string" class="truncate max-w-[180px]">file.txt</span>
                    <button onclick="clearFileStaging()" class="hover:bg-zinc-300 rounded-full p-0.5 ml-1 transition">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </div>

                <div class="w-full flex items-center gap-2 sm:gap-3">
                    <button onclick="document.getElementById('attachment-file-engine').click()" class="p-2 hover:bg-zinc-200/70 rounded-full text-zinc-600 transition shrink-0">
                        <i data-lucide="plus" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                    </button>
                    
                    <input type="text" id="input-prompt-shell" placeholder="Ask Askme" autocomplete="off"
                           class="flex-1 bg-transparent border-none outline-none text-zinc-800 placeholder-zinc-500 text-[15px] sm:text-[16px] py-1 min-w-0"
                           onkeydown="if(event.key === 'Enter') dispatchAskmeAI()">
                    
                    <button id="voice-activation-key" onclick="toggleVoiceTransmission()" class="p-2 hover:bg-zinc-200/70 rounded-full text-zinc-600 transition shrink-0">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>

                    <button onclick="dispatchAskmeAI()" class="p-2 sm:p-2.5 bg-sky-100 text-sky-600 hover:bg-sky-200/80 rounded-full transition shadow-sm flex items-center justify-center shrink-0">
                        <i data-lucide="audio-lines" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </footer>
    </main>

    <script>
        lucide.createIcons();

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const dropdown = document.getElementById('model-dropdown');
        const splashView = document.getElementById('splash-view');
        const stream = document.getElementById('message-feed-stream');
        const inputField = document.getElementById('input-prompt-shell');
        const scroller = document.getElementById('scroll-workspace');
        const modelLabel = document.getElementById('active-model-display');
        const arrowIcon = document.getElementById('dropdown-arrow-icon');
        const thinkingSubmenu = document.getElementById('thinking-submenu');
        const thinkingArrow = document.getElementById('thinking-arrow');
        const historyContainer = document.getElementById('history-item-list');
        const actionPopup = document.getElementById('action-popup-menu');
        const popupWrapper = document.getElementById('popup-actions-wrapper');

        let selectedConfigModel = "gemini-1.5-pro"; 
        let thinkingSetting = "Standard";
        let liveSessionsDatastore = {}; 
        let currentActiveSessionId = null;
        let stagedFileData = null;
        let isLibraryModeActive = false;
        let activeRecordingState = false;
        let audioVoiceRecognizer = null;
        let touchTimer = null;

        const CORE_AI_BLUEPRINT = "You are Askme AI, a direct instance clone of Gemini engineered by FidaHakim. You address the user as 'Boss' or 'Senpai'. Tone: supportive, code-focused, sharp, and highly concise. IMPORTANT: If the user requests you to generate, create, or display an image, artwork, illustration, or photo, you MUST respond by generating it using your internal image capabilities or by outputting standard HTML image structures using available web URLs. If user uploaded files, their details are injected at top of prompt.";

        document.addEventListener("DOMContentLoaded", () => {
            evaluateUserIdentityState();
            setupVoiceRecognitionEngine();
            document.addEventListener('click', hideActionPopupMenu);
            if (scroller) scroller.addEventListener('scroll', hideActionPopupMenu);
        });

        async function evaluateUserIdentityState() {
            const avatar = document.getElementById('user-avatar');
            const nameField = document.getElementById('user-name');
            const statusField = document.getElementById('user-status');

            if (puter.auth.isSignedIn()) {
                const profile = await puter.auth.getUser();
                if (nameField) nameField.innerText = profile.username;
                if (statusField) statusField.innerText = "Log Out Account";
                if (avatar) {
                    avatar.innerText = profile.username.substring(0,2).toUpperCase();
                    avatar.className = "w-10 h-10 rounded-full bg-green-600 flex items-center justify-center font-bold text-sm text-white shadow-sm overflow-hidden select-none";
                }
                try {
                    const savedCloudData = await puter.kv.get('askme_sessions_vault');
                    if (savedCloudData) {
                        liveSessionsDatastore = JSON.parse(savedCloudData);
                        syncHistorySidebarList();
                    }
                } catch(kvErr) { console.warn("KV sync failed: ", kvErr); }
            }
        }

        async function handleAuthAction() {
            if (puter.auth.isSignedIn()) {
                puter.auth.signOut();
                liveSessionsDatastore = {};
                startNewChat();
                syncHistorySidebarList();
                evaluateUserIdentityState();
            } else {
                await puter.auth.signIn();
                evaluateUserIdentityState();
            }
        }

        function setupVoiceRecognitionEngine() {
            const SpeechEngineClass = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechEngineClass) return;
            audioVoiceRecognizer = new SpeechEngineClass();
            audioVoiceRecognizer.continuous = false;
            audioVoiceRecognizer.interimResults = false;
            audioVoiceRecognizer.lang = 'en-US';

            audioVoiceRecognizer.onstart = () => {
                activeRecordingState = true;
                const micBtn = document.getElementById('voice-activation-key');
                if (micBtn) micBtn.classList.add('bg-red-100', 'text-red-500');
                if (inputField) inputField.placeholder = "Listening attentively...";
            };

            audioVoiceRecognizer.onresult = (event) => {
                const vocalInputTranscript = event.results[0][0].transcript;
                if (inputField && vocalInputTranscript) inputField.value = (inputField.value + " " + vocalInputTranscript).trim();
            };

            audioVoiceRecognizer.onend = () => {
                activeRecordingState = false;
                const micBtn = document.getElementById('voice-activation-key');
                if (micBtn) micBtn.classList.remove('bg-red-100', 'text-red-500');
                if (inputField) inputField.placeholder = "Ask Askme";
            };
        }

        function toggleVoiceTransmission() {
            if (!audioVoiceRecognizer) return;
            if (!activeRecordingState) audioVoiceRecognizer.start(); else audioVoiceRecognizer.stop();
        }

        function handleFileSelected(inputElement) {
            const selectedFileObj = inputElement.files[0];
            if (!selectedFileObj) return;
            const fileReaderChannel = new FileReader();
            fileReaderChannel.onload = (e) => {
                stagedFileData = { name: selectedFileObj.name, size: selectedFileObj.size, type: selectedFileObj.type, rawPayloadContent: e.target.result };
                const metaString = document.getElementById('file-meta-string');
                const previewBay = document.getElementById('file-preview-bay');
                if (metaString) metaString.innerText = `${stagedFileData.name} (${Math.round(stagedFileData.size / 1024)} KB)`;
                if (previewBay) { previewBay.classList.remove('hidden'); previewBay.classList.add('flex'); }
            };
            if (selectedFileObj.type.startsWith('text/') || selectedFileObj.name.endsWith('.json') || selectedFileObj.name.endsWith('.xml') || selectedFileObj.name.endsWith('.js') || selectedFileObj.name.endsWith('.html') || selectedFileObj.name.endsWith('.css')) fileReaderChannel.readAsText(selectedFileObj); else fileReaderChannel.readAsDataURL(selectedFileObj);
        }

        function clearFileStaging() {
            stagedFileData = null;
            const fileEngine = document.getElementById('attachment-file-engine');
            const previewBay = document.getElementById('file-preview-bay');
            if (fileEngine) fileEngine.value = "";
            if (previewBay) { previewBay.classList.add('hidden'); previewBay.classList.remove('flex'); }
        }

        function toggleSidebar() {
            if (!sidebar || !overlay) return;
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 250);
            }
        }

        function toggleDropdownMenu() {
            if (!dropdown || !arrowIcon) return;
            const hidden = dropdown.classList.toggle('hidden');
            arrowIcon.style.transform = hidden ? "rotate(0deg)" : "rotate(180deg)";
        }

        function toggleThinkingSubmenu(event) {
            if (event) event.stopPropagation();
            if (!thinkingSubmenu || !thinkingArrow) return;
            if (thinkingSubmenu.classList.contains('hidden')) {
                thinkingSubmenu.classList.remove('hidden');
                thinkingSubmenu.style.maxHeight = "200px";
                thinkingArrow.classList.add('rotate-180');
            } else {
                thinkingSubmenu.style.maxHeight = "0px";
                thinkingArrow.classList.remove('rotate-180');
                setTimeout(() => thinkingSubmenu.classList.add('hidden'), 200);
            }
        }

        function selectModel(modelName) {
            if (modelLabel) modelLabel.innerText = "Askme " + modelName;
            document.querySelectorAll('.check-icon').forEach(icon => icon.classList.add('invisible'));
            if(modelName === '4.5') {
                const icon = document.getElementById('chk-4-5');
                if (icon) icon.classList.remove('invisible');
                selectedConfigModel = "gemini-1.5-pro";
            } else if(modelName === 'OpenAI GPT') {
                const icon = document.getElementById('chk-openai');
                if (icon) icon.classList.remove('invisible');
                selectedConfigModel = "gpt-4o-mini";
            }
            toggleDropdownMenu();
        }

        function selectThinkingLevel(level) {
            thinkingSetting = level;
            document.querySelectorAll('.thinking-check').forEach(i => i.classList.add('invisible'));
            if(level === 'Standard') { const icon = document.getElementById('chk-standard'); if (icon) icon.classList.remove('invisible'); }
            if(level === 'Extended') { const icon = document.getElementById('chk-extended'); if (icon) icon.classList.remove('invisible'); }
            toggleDropdownMenu();
        }

        function startNewChat() {
            currentActiveSessionId = null;
            stagedFileData = null;
            const fileEngine = document.getElementById('attachment-file-engine');
            if (fileEngine) fileEngine.value = "";
            const previewBay = document.getElementById('file-preview-bay');
            if (previewBay) { previewBay.classList.add('hidden'); previewBay.classList.remove('flex'); }
            if (stream) { stream.innerHTML = ''; stream.classList.add('hidden'); }
            if (splashView) splashView.classList.remove('hidden');
            if (inputField) inputField.value = '';
            if (sidebar && !sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        function filterChatHistory() {
            if (!historyContainer) return;
            const searchInput = document.getElementById('search-chat-input');
            const currentSearchQuery = searchInput ? searchInput.value.toLowerCase() : "";
            const historyElements = historyContainer.querySelectorAll('.dynamic-history-item');
            historyElements.forEach(item => {
                if (item.innerText.toLowerCase().includes(currentSearchQuery)) item.classList.remove('hidden'); else item.classList.add('hidden');
            });
        }

        function toggleLibraryMode() {
            isLibraryModeActive = !isLibraryModeActive;
            const toggleBtn = document.getElementById('library-toggle-btn');
            const btnText = document.getElementById('library-btn-text');
            const sectionTitle = document.getElementById('section-title-label');
            if (isLibraryModeActive) {
                if (toggleBtn) { toggleBtn.classList.remove('bg-white/60', 'text-zinc-700'); toggleBtn.classList.add('bg-blue-600/80', 'text-white'); }
                if (btnText) btnText.innerText = "Recents"; if (sectionTitle) sectionTitle.innerText = "Library Vault";
            } else {
                if (toggleBtn) { toggleBtn.classList.remove('bg-blue-600/80', 'text-white'); toggleBtn.classList.add('bg-white/60', 'text-zinc-700'); }
                if (btnText) btnText.innerText = "Library"; if (sectionTitle) sectionTitle.innerText = "Recents";
            }
            syncHistorySidebarList();
        }

        function syncHistorySidebarList() {
            if (!historyContainer) return;
            const emptyNotice = document.getElementById('empty-history-notice');
            const keys = Object.keys(liveSessionsDatastore);
            if(keys.length === 0) { if(emptyNotice) { emptyNotice.innerText = "No recent chats."; emptyNotice.classList.remove('hidden'); } return; }
            if(emptyNotice) emptyNotice.classList.add('hidden');
            historyContainer.querySelectorAll('.dynamic-history-item').forEach(el => el.remove());
            [...keys].reverse().forEach(id => {
                const sessionTitle = liveSessionsDatastore[id].title;
                const row = document.createElement('div');
                row.className = isLibraryModeActive ? "dynamic-history-item w-full overflow-hidden whitespace-nowrap px-4 py-2.5 text-[14px] font-medium text-blue-900 cursor-pointer bg-white/40 rounded-xl transition border-l-4 border-blue-500 mb-0.5" : "dynamic-history-item w-full overflow-hidden whitespace-nowrap px-4 py-2.5 text-[14px] text-zinc-700 font-medium cursor-pointer hover:bg-zinc-200/50 rounded-xl transition mb-0.5";
                row.innerText = sessionTitle.length > 24 ? sessionTitle.substring(0, 24) + "..." : sessionTitle;
                row.onclick = () => loadActiveSession(id);
                historyContainer.appendChild(row);
            });
        }

        function renderFormattedContent(text) {
            if (!text) return "";
            let protectedStr = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            protectedStr = protectedStr.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, url) => `<img src="${url.replace(/&amp;/g, '&')}" alt="${alt}" class="max-w-full rounded-2xl my-3 border border-zinc-200 object-contain max-h-[350px]">`);
            return protectedStr.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-black">$1</strong>').replace(/\n/g, '<br>');
        }

        function registerLongPressEvents(element, role, index) {
            if (!element) return;
            element.addEventListener('mousedown', (e) => {
                touchTimer = setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(12);
                    showActionPopupMenu(e.clientX, e.clientY, role, index);
                }, 550);
            });
            element.addEventListener('mouseup', () => clearTimeout(touchTimer));
        }

        function showActionPopupMenu(x, y, role, index) {
            if (!popupWrapper || !actionPopup) return;
            popupWrapper.innerHTML = `
                <button onclick="copyMessageToClipboard(${index})" class="w-full text-left px-3 py-2 text-xs text-zinc-800 hover:bg-zinc-100 rounded-xl">Copy</button>
            `;
            actionPopup.classList.remove('hidden', 'scale-95', 'opacity-0');
            actionPopup.style.left = `${Math.min(x, window.innerWidth - 150)}px`;
            actionPopup.style.top = `${Math.min(y, window.innerHeight - 100)}px`;
            actionPopup.classList.add('scale-100', 'opacity-100');
        }

        function hideActionPopupMenu() {
            if (!actionPopup) return;
            actionPopup.classList.remove('scale-100', 'opacity-100');
            actionPopup.classList.add('scale-95', 'opacity-0');
            setTimeout(() => actionPopup.classList.add('hidden'), 150);
        }

        function copyMessageToClipboard(index) {
            const messageObj = liveSessionsDatastore[currentActiveSessionId].messages[index];
            if (messageObj) navigator.clipboard.writeText(typeof messageObj.content === 'string' ? messageObj.content : "");
            hideActionPopupMenu();
        }

        function loadActiveSession(id) {
            if (!stream || !scroller) return;
            currentActiveSessionId = id;
            stream.classList.remove('hidden'); stream.innerHTML = '';
            if (splashView) splashView.classList.add('hidden');
            liveSessionsDatastore[id].messages.forEach((msg, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = msg.role === 'user' ? "w-full flex justify-end" : "w-full flex justify-start pt-2";
                wrapper.innerHTML = `<div class="msg-bubble ${msg.role === 'user' ? 'bg-zinc-100' : 'bg-white'} px-4 py-2.5 rounded-[24px] shadow-sm text-[15px]">${renderFormattedContent(typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content))}</div>`;
                registerLongPressEvents(wrapper.querySelector('.msg-bubble'), msg.role, idx);
                stream.appendChild(wrapper);
            });
            if(sidebar && !sidebar.classList.contains('-translate-x-full')) toggleSidebar();
            scroller.scrollTop = scroller.scrollHeight;
        }

        async function dispatchAskmeAI() {
            if (!inputField || !stream || !scroller) return;
            let val = inputField.value.trim();
            if(!val && !stagedFileData) return;
            let isImageRequest = /\b(generate|create|make|draw|show)\b.*\b(image|picture|photo|artwork|illustration|logo)\b/i.test(val);
            inputField.value = '';
            if (splashView) splashView.classList.add('hidden');
            stream.classList.remove('hidden');

            if (currentActiveSessionId === null) {
                currentActiveSessionId = "session_" + Date.now();
                liveSessionsDatastore[currentActiveSessionId] = { title: val || "New Chat", messages: [] };
            }

            liveSessionsDatastore[currentActiveSessionId].messages.push({ role: "user", content: val });
            const userWrapper = document.createElement('div');
            userWrapper.className = "w-full flex justify-end";
            userWrapper.innerHTML = `<div class="msg-bubble bg-zinc-100 px-4 py-2.5 rounded-[24px] shadow-sm text-[15px]">${renderFormattedContent(val)}</div>`;
            stream.appendChild(userWrapper);
            syncHistorySidebarList();

            try {
                let txt = "";
                if (isImageRequest) {
                    const imgResult = await fetch(`https://pollinations.ai/prompt/${encodeURIComponent(val)}`);
                    txt = `Here is your requested image, Boss:\n\n![Generated Image](${imgResult.url})`;
                } else {
                    const response = await puter.ai.chat(liveSessionsDatastore[currentActiveSessionId].messages, { model: selectedConfigModel });
                    txt = (typeof response === 'string') ? response : (response?.message?.content || "");
                }
                
                liveSessionsDatastore[currentActiveSessionId].messages.push({ role: "assistant", content: txt });
                const assistantWrapper = document.createElement('div');
                assistantWrapper.className = "w-full flex justify-start pt-2";
                assistantWrapper.innerHTML = `<div class="msg-bubble bg-white px-4 py-2.5 rounded-[24px] shadow-sm text-[15px]">${renderFormattedContent(txt)}</div>`;
                stream.appendChild(assistantWrapper);
                scroller.scrollTop = scroller.scrollHeight;
                if (puter.auth.isSignedIn()) puter.kv.set('askme_sessions_vault', JSON.stringify(liveSessionsDatastore));
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
