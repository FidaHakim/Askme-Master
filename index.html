<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Askme AI</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(-45deg, #a8c0ff, #fbc7d4, #e1eec3, #f05286, #36d1dc, #5b86e5);
            background-size: 400% 400%;
            animation: gradientMove 18s ease infinite;
            color: #1f1f1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100vh;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .ambient-panel {
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(20px) saturate(140%) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
        }
        
        #sidebar { transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); }
        .pulse-mic { animation: mic-pulse 1.5s infinite; }
        
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes mic-pulse { 0% { transform: scale(1); background-color: rgba(239, 68, 68, 0.2); } 50% { transform: scale(1.1); background-color: rgba(239, 68, 68, 0.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full select-none overflow-hidden pb-[env(safe-area-inset-bottom)]">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/20 z-40 opacity-0 backdrop-blur-[2px]"></div>

    <div id="sidebar" class="fixed top-0 left-0 bottom-0 w-[82vw] max-w-[340px] z-50 -translate-x-full flex flex-col justify-between px-3 py-4 ambient-panel">
        <div class="space-y-4">
            <div class="px-3 text-xl font-medium text-zinc-800">Askme</div>
            <button onclick="createNewChat()" class="w-full flex items-center space-x-3 bg-white/60 px-4 py-3 rounded-2xl text-sm font-medium border border-white/40">
                <span>New chat</span>
            </button>
            <div id="history-item-list" class="flex-1 overflow-y-auto no-scrollbar space-y-1"></div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col relative h-full w-full overflow-hidden">
        <header class="w-full px-4 pt-safe py-3 flex justify-between items-center z-30">
            <button onclick="toggleSidebar()" class="p-2 text-zinc-800"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3.75 9h16.5m-16.5 6.75h16.5" /></svg></button>
            <span class="font-medium text-zinc-800">Askme 3.5 Flash</span>
            <div class="w-10"></div>
        </header>

        <main id="scroll-workspace" class="flex-1 overflow-y-auto px-4 no-scrollbar">
            <div id="message-feed-stream" class="space-y-4 pt-2 pb-8"></div>
        </main>

        <!-- Optimized Input Footer -->
        <footer class="p-3 w-full shrink-0">
            <div class="rounded-[24px] px-2 py-1.5 flex items-center shadow-lg ambient-panel max-w-lg mx-auto border border-white/50">
                <button onclick="document.getElementById('attachment-file-engine').click()" class="p-2.5 text-zinc-700 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15"/></svg>
                </button>
                
                <input 
                    id="input-prompt-shell" 
                    type="text" 
                    placeholder="Ask Askme..." 
                    class="flex-1 bg-transparent text-[16px] px-2 py-3 outline-none text-zinc-900 min-w-0"
                >

                <div class="flex items-center shrink-0 space-x-1">
                    <button id="voice-activation-key" onclick="toggleVoiceTransmission()" class="p-2.5 text-zinc-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/></svg>
                    </button>
                    <button onclick="dispatchAskmeAI()" class="w-9 h-9 bg-zinc-900 text-white rounded-full flex items-center justify-center shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M4.5 10.5L12 3m0 0l7.5 7.5M12 3v18"/></svg>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // Core functions kept for functionality
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sb.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
        
        async function dispatchAskmeAI() {
            const input = document.getElementById('input-prompt-shell');
            if(!input.value.trim()) return;
            // Add dispatch logic here
            input.value = '';
        }
    </script>
</body>
</html>
