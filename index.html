<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Askme AI</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(-45deg, #a8c0ff, #fbc7d4, #e1eec3, #f05286, #36d1dc, #5b86e5);
            background-size: 400% 400%;
            animation: gradientMove 18s ease infinite;
            color: #1f1f1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Mobile fixes for input area */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        .ambient-panel {
            background: rgba(255, 255, 255, 0.45) !important;
            backdrop-filter: blur(20px) saturate(140%) !important;
            -webkit-backdrop-filter: blur(20px) saturate(140%) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
        }

        .ambient-card {
            background: rgba(255, 255, 255, 0.6) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
        }

        .ambient-input {
            background: rgba(255, 255, 255, 0.4) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
        }
        
        #sidebar { 
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); 
            background: rgba(255, 255, 255, 0.5) !important;
            backdrop-filter: blur(25px) saturate(150%) !important;
            -webkit-backdrop-filter: blur(25px) saturate(150%) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        #sidebar-overlay { transition: opacity 0.25s ease; }
        #thinking-submenu { transition: all 0.2s ease-out; }
        .pulse-mic { animation: mic-pulse 1.5s infinite; }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes mic-pulse {
            0% { transform: scale(1); background-color: rgba(239, 68, 68, 0.2); }
            50% { transform: scale(1.1); background-color: rgba(239, 68, 68, 0.5); }
            100% { transform: scale(1); background-color: rgba(239, 68, 68, 0.2); }
        }

        .msg-bubble {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full select-none overflow-hidden">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/20 z-40 opacity-0 backdrop-blur-[2px]"></div>

    <div id="sidebar" class="fixed top-0 left-0 bottom-0 w-[82vw] max-w-[340px] z-50 -translate-x-full flex flex-col justify-between px-3 py-4 text-[#1e1e1e]">
        <div class="space-y-4">
            <div class="px-3 py-1 text-xl font-normal tracking-wide text-zinc-800 flex justify-between items-center">
                <span>Askme</span>
                <button onclick="toggleLibraryMode()" id="library-toggle-btn" class="text-xs flex items-center space-x-1 bg-white/60 hover:bg-white/80 transition px-2.5 py-1 rounded-full font-medium text-zinc-700 border border-white/40 shadow-sm">
                    <span id="library-btn-text">Library</span>
                </button>
            </div>
            
            <div class="px-2">
                <button onclick="createNewChat()" class="w-full flex items-center space-x-3 bg-white/70 hover:bg-white/90 transition px-4 py-3 rounded-full text-sm font-medium border border-white/50 shadow-sm">
                    <span>New chat</span>
                </button>
            </div>

            <div class="px-2">
                <input id="search-chat-input" type="text" placeholder="Search chats..." oninput="filterChatHistory()" class="w-full bg-white/40 rounded-xl px-3 py-2 text-sm outline-none border border-white/30 placeholder-zinc-500">
            </div>

            <div class="space-y-0.5 pt-1">
                <div id="section-title-label" class="px-4 pb-2 text-xs font-semibold text-zinc-500 uppercase tracking-wider">Recents</div>
                <div id="history-item-list" class="max-h-[48vh] overflow-y-auto no-scrollbar space-y-0.5">
                    <div id="empty-history-notice" class="px-4 py-3 text-xs text-zinc-500 italic font-normal">No recent chats.</div>
                </div>
            </div>
        </div>

        <div id="account-box" class="border-t border-white/40 pt-3 flex items-center px-4 cursor-pointer" onclick="handleAuthAction()">
            <div class="flex items-center space-x-3">
                <div id="user-avatar" class="w-8 h-8 rounded-full bg-zinc-700/80 flex items-center justify-center text-white text-xs">?</div>
                <div class="flex flex-col">
                    <span id="user-name" class="text-sm font-medium text-zinc-900">Guest</span>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col h-full w-full relative">
        <header class="w-full px-4 pt-4 pb-2 flex justify-between items-center z-30">
            <button onclick="toggleSidebar()" class="p-2 text-zinc-800 rounded-full hover:bg-white/20">☰</button>
            <button onclick="toggleDropdownMenu()" class="text-[17px] font-normal text-zinc-800">Askme 3.5 Flash</button>
            <button onclick="createNewChat()" class="p-2 text-zinc-800 rounded-full hover:bg-white/20">+</button>
        </header>

        <main id="scroll-workspace" class="flex-1 overflow-y-auto px-4 no-scrollbar">
            <div id="splash-view" class="h-full flex flex-col items-center justify-center text-center">
                <h2 class="text-[32px] font-normal">What should we focus on?</h2>
            </div>
            <div id="message-feed-stream" class="hidden space-y-4 pt-2 pb-8"></div>
        </main>

        <footer class="p-3 w-full bg-transparent z-40 pb-safe">
            <div class="rounded-[28px] px-3 py-2 flex flex-col shadow-lg max-w-xl mx-auto ambient-panel">
                <div class="flex items-center w-full">
                    <input id="input-prompt-shell" type="text" placeholder="Ask Askme" class="flex-1 bg-transparent text-[16px] px-2 py-3 outline-none" onkeypress="if(event.key === 'Enter') dispatchAskmeAI()">
                    <button onclick="dispatchAskmeAI()" class="w-10 h-10 bg-white/60 rounded-full flex items-center justify-center font-bold">↑</button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const inputField = document.getElementById('input-prompt-shell');
        const stream = document.getElementById('message-feed-stream');
        const splashView = document.getElementById('splash-view');
        const scroller = document.getElementById('scroll-workspace');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
            overlay.classList.toggle('opacity-100');
        }

        function createNewChat() {
            stream.innerHTML = '';
            stream.classList.add('hidden');
            splashView.classList.remove('hidden');
            if (!sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        async function dispatchAskmeAI() {
            const val = inputField.value.trim();
            if (!val) return;
            inputField.value = '';
            splashView.classList.add('hidden');
            stream.classList.remove('hidden');
            
            const div = document.createElement('div');
            div.className = 'text-right';
            div.innerHTML = `<div class="inline-block px-4 py-3 rounded-2xl ambient-card m-1">${val}</div>`;
            stream.appendChild(div);
            
            const resp = await puter.ai.chat(val);
            const resDiv = document.createElement('div');
            resDiv.className = 'text-left';
            resDiv.innerHTML = `<div class="inline-block px-4 py-3 rounded-2xl ambient-card m-1">${resp}</div>`;
            stream.appendChild(resDiv);
            scroller.scrollTop = scroller.scrollHeight;
        }
    </script>
</body>
</html>
